<!doctype html>
<html lang="en" data-theme="console">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components/bundle.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="../components/bundle.js"></script><title>MobileMenu — preview</title></head>
<body>
<div id="root" class="st-root"></div>
<script>
  var S = window.Starter, h = React.createElement, F = React.Fragment;
  function both(fn) {
    return h('div', { className: 'st-pair' }, ['console', 'portal'].map(function (t) {
      return h('div', { key: t, 'data-theme': t, className: 'st-theme' }, h('p', { className: 'st-theme-name' }, t === 'console' ? 'Console' : 'Portal'), fn(t));
    }));
  }
  function state(label, el) { return h('div', { className: 'st-state', key: label }, el, h('span', { className: 'st-state-name' }, label)); }
  var NAV = [
    { label: 'Dashboard', icon: 'layout-dashboard' },
    { section: 'Platform' },
    { label: 'User & Role', icon: 'users', open: true, children: [{ label: 'Users' }, { label: 'Roles' }] },
    { label: 'System', icon: 'settings', open: true, children: [
      { label: 'Notification', children: [{ label: 'Notification Templates' }, { label: 'Delivery Log' }] },
      { label: 'Logs', open: true, children: [{ label: 'Audit Log' }, { label: 'System Logs' }, { label: 'Error Logs' }] },
      { label: 'Background Jobs' },
      { label: 'Languages', children: [{ label: 'Language Master' }, { label: 'App Translations' }] },
      { label: 'Tech Documentation' }
    ] }
  ];
  ReactDOM.createRoot(document.getElementById('root')).render(both(function () {
    return h('div', { className: 'st-frame', style: { width: '390px', maxWidth: '100%', height: '640px' } },
      h(S.MobileMenu, { appName: 'Admin Console', count: 1, items: NAV, active: 'Users' }));
  }));
</script>
</body>
</html>

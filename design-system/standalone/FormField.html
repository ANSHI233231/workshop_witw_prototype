<!doctype html>
<html lang="en" data-theme="console">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components/bundle.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="../components/bundle.js"></script><title>FormField — preview</title></head>
<body>
<div id="root" class="st-root"></div>
<script>
  var S = window.Starter, h = React.createElement, F = React.Fragment;
  function both(fn) {
    return h('div', { className: 'st-pair' }, ['console', 'portal'].map(function (t) {
      return h('div', { key: t, 'data-theme': t, className: 'st-theme' }, h('p', { className: 'st-theme-name' }, t === 'console' ? 'Console' : 'Portal'), fn(t));
    }));
  }
  function state(label, el) { return h('div', { className: 'st-state', key: label }, el, h('span', { className: 'st-state-name' }, label)); }
  ReactDOM.createRoot(document.getElementById('root')).render(both(function () {
    return h('div', { className: 'st-col', style: { gap: 'var(--space-xl)' } }, h('div', { className: 'st-grid-2' },
      h(S.FormField, { label: 'Name', required: true, placeholder: 'Enter full name' }),
      h(S.FormField, { label: 'Mobile', required: true, value: '98', error: 'Enter a 10-digit mobile number.' }),
      h(S.FormField, { label: 'Email', placeholder: 'Enter email', state: 'focus', helper: 'Used to log in and for password reset.' }),
      h(S.FormField, { label: 'New Password', required: true, type: 'password', placeholder: 'Enter new password' }),
      h(S.FormField, { label: 'Username', value: 'starter.admin', disabled: true })),
      h('div', { className: 'st-card' },
        h('div', { className: 'st-card-title' }, h('span', null, 'Add User — after Save with empty fields')),
        h('div', { className: 'st-grid-2' },
          h(S.FormField, { label: 'Name', required: true, placeholder: 'Enter full name', error: 'Enter a name.' }),
          h(S.FormField, { label: 'Mobile', required: true, placeholder: 'Enter 10-digit mobile number', error: 'Enter a 10-digit mobile number.' }),
          h(S.FormField, { label: 'Email', required: true, value: 'priya.sharma@example.test', error: 'This email is already in use.' }),
          h(S.FormField, { label: 'Username', placeholder: 'Choose a username (optional)' }),
          h(S.FormField, { label: 'Password', required: true, type: 'password', placeholder: 'Enter password', error: 'Enter a password.' }),
          h(S.FormField, { label: 'Confirm Password', required: true, type: 'password', placeholder: 'Confirm password', error: 'Re-enter the password.' }))));
  }));
</script>
</body>
</html>

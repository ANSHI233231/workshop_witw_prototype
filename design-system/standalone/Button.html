<!doctype html>
<html lang="en" data-theme="console">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components/bundle.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="../components/bundle.js"></script><title>Button — preview</title></head>
<body>
<div id="root" class="st-root"></div>
<script>
  var S = window.Starter, h = React.createElement, F = React.Fragment;
  function both(fn) {
    return h('div', { className: 'st-pair' }, ['console', 'portal'].map(function (t) {
      return h('div', { key: t, 'data-theme': t, className: 'st-theme' }, h('p', { className: 'st-theme-name' }, t === 'console' ? 'Console' : 'Portal'), fn(t));
    }));
  }
  function state(label, el) { return h('div', { className: 'st-state', key: label }, el, h('span', { className: 'st-state-name' }, label)); }
  var STATES = [['Normal'], ['Hover', 'hover'], ['Focus', 'focus'], ['Disabled', null, true]];
  function row(v, t, ic) { return h('div', { className: 'st-row', key: v }, STATES.map(function (s) { return state(s[0], h(S.Button, { variant: v, icon: ic, state: s[1], disabled: s[2] }, t)); })); }
  ReactDOM.createRoot(document.getElementById('root')).render(both(function () {
    return h('div', { className: 'st-col' }, row('primary', 'Add User', 'plus'), row('secondary', 'Export', 'file-down'), row('text', 'Reset', 'rotate-ccw'), row('danger', 'Delete'));
  }));
</script>
</body>
</html>

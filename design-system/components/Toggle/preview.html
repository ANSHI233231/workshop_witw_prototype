<!-- @dsCard group="Inputs" height=180 subtitle="Off, on — hover, focus, disabled" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Toggle — preview</title></head>
<body>
<div id="root" class="st-root"></div>
<script>
  var S = window.Starter, h = React.createElement, F = React.Fragment;
  function both(fn) {
    return h('div', { className: 'st-pair' }, ['console', 'portal'].map(function (t) {
      return h('div', { key: t, 'data-theme': t, className: 'st-theme' }, h('p', { className: 'st-theme-name' }, t === 'console' ? 'Console' : 'Portal'), fn(t));
    }));
  }
  function state(label, el) { return h('div', { className: 'st-state', key: label }, el, h('span', { className: 'st-state-name' }, label)); }
  ReactDOM.createRoot(document.getElementById('root')).render(both(function () {
    return h('div', { className: 'st-row' },
      state('Off', h(S.Toggle, { label: 'Activate' })),
      state('On', h(S.Toggle, { label: 'Deactivate', checked: true })),
      state('Hover', h(S.Toggle, { label: 'Deactivate', checked: true, state: 'hover' })),
      state('Focus', h(S.Toggle, { label: 'Deactivate', checked: true, state: 'focus' })),
      state('Disabled', h(S.Toggle, { label: 'Deactivate', checked: true, disabled: true })));
  }));
</script>
</body>
</html>

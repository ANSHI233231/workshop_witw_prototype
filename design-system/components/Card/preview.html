<!-- @dsCard group="Data" height=300 subtitle="Card with title, text and Open action" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Card — preview</title></head>
<body>
<div id="root" class="st-root"></div>
<script>
  var S = window.Starter, h = React.createElement, F = React.Fragment;
  function both(fn) {
    return h('div', { className: 'st-pair' }, ['console', 'portal'].map(function (t) {
      return h('div', { key: t, 'data-theme': t, className: 'st-theme' }, h('p', { className: 'st-theme-name' }, t === 'console' ? 'Console' : 'Portal'), fn(t));
    }));
  }
  function state(label, el) { return h('div', { className: 'st-state', key: label }, el, h('span', { className: 'st-state-name' }, label)); }
  ReactDOM.createRoot(document.getElementById('root')).render(both(function () {
    return h('div', { className: 'st-grid-2' },
      h(S.Card, { title: 'Audit Log', action: h(S.Button, { variant: 'text', href: '#' }, 'Open'), text: 'Who did what, from every app.' }),
      h(S.Card, { title: 'Error Logs', action: h(S.Button, { variant: 'text', href: '#' }, 'Open'), text: 'Server and browser errors of every app.' }));
  }));
</script>
</body>
</html>

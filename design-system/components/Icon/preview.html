<!-- @dsCard group="Foundations" height=220 subtitle="Lucide icons used in the app, stroke 2" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Icon — preview</title></head>
<body>
<div id="root" class="st-root"></div>
<script>
  var S = window.Starter, h = React.createElement, F = React.Fragment;
  function both(fn) {
    return h('div', { className: 'st-pair' }, ['console', 'portal'].map(function (t) {
      return h('div', { key: t, 'data-theme': t, className: 'st-theme' }, h('p', { className: 'st-theme-name' }, t === 'console' ? 'Console' : 'Portal'), fn(t));
    }));
  }
  function state(label, el) { return h('div', { className: 'st-state', key: label }, el, h('span', { className: 'st-state-name' }, label)); }
  var NAMES = ['search','pencil','key-round','bell','plus','file-down','rotate-ccw','x','menu','chevron-down','chevron-right','chevron-left','layout-dashboard','users','settings','shield-check','lock','log-out','eye','triangle-alert','check','check-check','save','arrow-left','clock','mail'];
  ReactDOM.createRoot(document.getElementById('root')).render(both(function () {
    return h('div', { className: 'st-row', style: { gap: 'var(--space-lg)' } }, NAMES.map(function (n) { return h('span', { key: n, title: n, style: { color: 'var(--text-muted)', display: 'inline-flex' } }, h(S.Icon, { name: n, size: 'lg' })); }));
  }));
</script>
</body>
</html>

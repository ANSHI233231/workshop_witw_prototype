<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WITW Design System</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { background: var(--background); color: var(--text); font-family: var(--font-sans); overflow: hidden; }
  .cover { position: relative; height: 288px; overflow: hidden; }
  .art { position: absolute; top: 0; left: 480px; width: 480px; height: 288px; overflow: hidden; }
  .art svg { display: block; width: 480px; height: 288px; }
  .brand { fill: var(--primary); }
  .deep { fill: var(--primary-active); }
  .sun { fill: var(--accent-1); }
  .accent { fill: var(--accent-2); }
  .blk { rx: var(--radius-lg); }
  .words { position: absolute; left: var(--space-xl); bottom: var(--space-xl); max-width: 440px; }
  .name { margin: 0; font-family: var(--font-display); font-size: 64px; line-height: .95; font-weight: 700; letter-spacing: -.01em; color: var(--text); }
  .tag { margin: var(--space-sm) 0 0 2px; font-size: 14px; line-height: 20px; color: var(--text-muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      primary 176×304 slab bled off top and bottom (WITW's forest green, largest) · accent-2 orange 96×144 bleeding off the top right · accent-1 a 96px disc (the sun) · primary-active hills — ≈35% of 960×288
  arrangement one tall green slab with satellites: the sun between slab and orange block, hills rising off the bottom edge
  pattern     a literal motif for "Walk Into The Wild": half-disc hills on the horizon, radius space-2xl and space-xl × 2, from the sun-and-landscape the name calls up
  scales      gutters space-lg; slab and block corners radius-lg; sun r = space-xl × 2; hills r = space-2xl (32) and 48; horizon on the bottom edge
-->
<rect class="brand blk" x="16" y="-16" width="176" height="320"/>
<rect class="accent blk" x="400" y="-16" width="96" height="160"/>
<circle class="sun" cx="296" cy="88" r="48"/>
<path class="deep" d="M208 288 a48 48 0 0 1 96 0 z"/>
<path class="deep" d="M288 288 a32 32 0 0 1 64 0 z"/>
<path class="deep" d="M336 288 a48 48 0 0 1 96 0 z"/>
<path class="deep" d="M416 288 a32 32 0 0 1 64 0 z"/>
</svg>
</div>
<div class="words">
<h1 class="name">WITW Design<br>System</h1>
<p class="tag">Walk Into The Wild: the Console and the Website, one system.</p>
</div>
</div>
</body>
</html>

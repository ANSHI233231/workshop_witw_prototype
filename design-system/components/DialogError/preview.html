<!-- @dsCard group="Feedback" height=1060 subtitle="Save failed: message at the top of the dialog body" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>DialogError — preview</title></head>
<body>
<div id="root" class="st-root"></div>
<script>
  var S = window.Starter, h = React.createElement, F = React.Fragment;
  function both(fn) {
    return h('div', { className: 'st-pair' }, ['console', 'portal'].map(function (t) {
      return h('div', { key: t, 'data-theme': t, className: 'st-theme' }, h('p', { className: 'st-theme-name' }, t === 'console' ? 'Console' : 'Portal'), fn(t));
    }));
  }
  function state(label, el) { return h('div', { className: 'st-state', key: label }, el, h('span', { className: 'st-state-name' }, label)); }
  ReactDOM.createRoot(document.getElementById('root')).render(both(function () {
    return h('div', { className: 'st-frame', style: { height: '480px' } },
      h(S.Dialog, { title: 'Add User', error: 'The user could not be saved. Please try again.',
        footer: h(F, null, h(S.Button, { variant: 'secondary' }, 'Cancel'), h(S.Button, { variant: 'primary', icon: 'save' }, 'Save')) },
        h('div', { className: 'st-grid-2' },
          h(S.FormField, { label: 'Name', required: true, value: 'Priya Sharma' }),
          h(S.FormField, { label: 'Mobile', required: true, value: '90000 00802' }),
          h(S.FormField, { label: 'Email', required: true, value: 'priya.sharma@example.test' }))));
  }));
</script>
</body>
</html>

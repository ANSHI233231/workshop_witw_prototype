<!-- @dsCard group="Inputs" height=240 subtitle="Search with icon — normal, hover, focus, error, disabled" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>SearchInput — preview</title></head>
<body>
<div id="root" class="st-root"></div>
<script>
  var S = window.Starter, h = React.createElement, F = React.Fragment;
  function both(fn) {
    return h('div', { className: 'st-pair' }, ['console', 'portal'].map(function (t) {
      return h('div', { key: t, 'data-theme': t, className: 'st-theme' }, h('p', { className: 'st-theme-name' }, t === 'console' ? 'Console' : 'Portal'), fn(t));
    }));
  }
  function state(label, el) { return h('div', { className: 'st-state', key: label }, el, h('span', { className: 'st-state-name' }, label)); }
  var ph = 'Search by name, mobile, email…';
  ReactDOM.createRoot(document.getElementById('root')).render(both(function () {
    return h('div', { className: 'st-row' },
      state('Normal', h(S.SearchInput, { placeholder: ph })),
      state('Hover', h(S.SearchInput, { placeholder: ph, state: 'hover' })),
      state('Focus', h(S.SearchInput, { value: 'Priya', state: 'focus' })),
      state('Error', h(S.SearchInput, { value: 'Priya', invalid: true })),
      state('Disabled', h(S.SearchInput, { placeholder: ph, disabled: true })));
  }));
</script>
</body>
</html>

<!-- @dsCard group="Navigation" height=300 subtitle="Pill tabs (Notification Templates) and underline tabs" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Tabs — preview</title></head>
<body>
<div id="root" class="st-root"></div>
<script>
  var S = window.Starter, h = React.createElement, F = React.Fragment;
  function both(fn) {
    return h('div', { className: 'st-pair' }, ['console', 'portal'].map(function (t) {
      return h('div', { key: t, 'data-theme': t, className: 'st-theme' }, h('p', { className: 'st-theme-name' }, t === 'console' ? 'Console' : 'Portal'), fn(t));
    }));
  }
  function state(label, el) { return h('div', { className: 'st-state', key: label }, el, h('span', { className: 'st-state-name' }, label)); }
  ReactDOM.createRoot(document.getElementById('root')).render(both(function () {
    return h('div', { className: 'st-col' },
      h('div', { className: 'st-table-card' }, h(S.Tabs, { variant: 'pill', items: [{ label: 'Email', icon: 'mail', count: 1 }, { label: 'In-app', icon: 'bell', count: 4, state: 'hover' }] })),
      h(S.Tabs, { items: ['All', { label: 'Unread', state: 'hover' }, { label: 'Read', state: 'focus' }] }));
  }));
</script>
</body>
</html>

<!-- @dsCard group="Shell" height=300 subtitle="Console and Partner portal on the green WITW header with the W mark; Portal" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>AppHeader — preview</title></head>
<body>
<div id="root" class="st-root"></div>
<script>
  var S = window.Starter, h = React.createElement, F = React.Fragment;
  function both(fn) {
    return h('div', { className: 'st-pair' }, ['console', 'portal'].map(function (t) {
      return h('div', { key: t, 'data-theme': t, className: 'st-theme' }, h('p', { className: 'st-theme-name' }, t === 'console' ? 'Console' : 'Portal'), fn(t));
    }));
  }
  function state(label, el) { return h('div', { className: 'st-state', key: label }, el, h('span', { className: 'st-state-name' }, label)); }
  ReactDOM.createRoot(document.getElementById('root')).render(both(function (t) {
    var mark = h('span', { className: 'st-mark' }, h('img', { src: '/_blob/2e725624cda8706e6cb43d2c6f9e1e4f', alt: 'Walk Into The Wild' }));
    if (t === 'console') return h('div', { className: 'st-col' }, h(S.AppHeader, { appName: 'Admin Console', logo: mark, role: 'Super Admin', count: 3, userName: 'Vikram Mehta' }), h(S.AppHeader, { appName: 'Partner Portal', logo: mark, role: 'Partner', count: 1, userName: 'Rohit Deshmukh' }));
    return h(S.AppHeader, { appName: 'Starter Portal', role: null, count: 1, userName: 'Priya Sharma' });
  }));
</script>
</body>
</html>

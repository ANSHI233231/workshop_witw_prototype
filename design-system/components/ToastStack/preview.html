<!-- @dsCard group="Feedback" height=1100 subtitle="Desktop: top right under the header; phone: across the bottom" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>ToastStack — preview</title></head>
<body>
<div id="root" class="st-root"></div>
<script>
  var S = window.Starter, h = React.createElement, F = React.Fragment;
  function both(fn) {
    return h('div', { className: 'st-pair' }, ['console', 'portal'].map(function (t) {
      return h('div', { key: t, 'data-theme': t, className: 'st-theme' }, h('p', { className: 'st-theme-name' }, t === 'console' ? 'Console' : 'Portal'), fn(t));
    }));
  }
  function state(label, el) { return h('div', { className: 'st-state', key: label }, el, h('span', { className: 'st-state-name' }, label)); }
  ReactDOM.createRoot(document.getElementById('root')).render(both(function (t) {
    var toasts = [{ id: 1, tone: 'success', message: 'User \u201cPriya Sharma\u201d marked inactive.' }, { id: 2, tone: 'error', message: 'This could not be done. Please try again.' }];
    return h('div', { className: 'st-row', style: { alignItems: 'flex-start' } },
      h('div', { className: 'st-frame', style: { flex: '1 1 520px', height: '260px' } },
        h(S.AppHeader, { appName: t === 'console' ? 'Admin Console' : 'Starter Portal', count: 1 }),
        h(S.ToastStack, { toasts: toasts })),
      h('div', { className: 'st-frame', style: { width: '390px', maxWidth: '100%', height: '260px' } },
        h(S.MobileMenu, { appName: t === 'console' ? 'Admin Console' : 'Starter Portal', count: 1, open: false, items: [] }),
        h(S.ToastStack, { toasts: toasts, placement: 'mobile' })));
  }));
</script>
</body>
</html>

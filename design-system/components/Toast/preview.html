<!-- @dsCard group="Feedback" height=400 subtitle="Success and error — close hover and focus" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Toast — preview</title></head>
<body>
<div id="root" class="st-root"></div>
<script>
  var S = window.Starter, h = React.createElement, F = React.Fragment;
  function both(fn) {
    return h('div', { className: 'st-pair' }, ['console', 'portal'].map(function (t) {
      return h('div', { key: t, 'data-theme': t, className: 'st-theme' }, h('p', { className: 'st-theme-name' }, t === 'console' ? 'Console' : 'Portal'), fn(t));
    }));
  }
  function state(label, el) { return h('div', { className: 'st-state', key: label }, el, h('span', { className: 'st-state-name' }, label)); }
  ReactDOM.createRoot(document.getElementById('root')).render(both(function () {
    return h('div', { className: 'st-col', style: { alignItems: 'flex-start' } },
      state('Success', h(S.Toast, { tone: 'success' }, 'User \u201cPriya Sharma\u201d added.')),
      state('Error', h(S.Toast, { tone: 'error' }, 'User \u201cPriya Sharma\u201d could not be changed. Please try again.')),
      state('Close hover', h(S.Toast, { tone: 'success', closeState: 'hover' }, 'Password updated.')));
  }));
</script>
</body>
</html>
